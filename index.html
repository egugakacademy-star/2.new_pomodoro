<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="pomodoro">
    <h1>Pomodoro</h1>
    <div id="current-time" class="current-time" aria-label="현재 시간"></div>

    <div class="tomato">
      <svg viewBox="0 0 300 250" aria-hidden="true">
        <defs>
          <radialGradient id="body" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#f25a45"/>
            <stop offset="60%" stop-color="#e0301e"/>
            <stop offset="100%" stop-color="#a81d0e"/>
          </radialGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5fae4f"/>
            <stop offset="100%" stop-color="#2d6e2a"/>
          </linearGradient>
        </defs>
        <!-- 토마토 몸통 -->
        <path d="M150 55 C 90 30, 10 70, 12 150 C 14 215, 80 242, 150 242 C 220 242, 286 215, 288 150 C 290 70, 210 30, 150 55 Z" fill="url(#body)"/>
        <!-- 광택 -->
        <ellipse cx="82" cy="105" rx="26" ry="14" fill="#fff" opacity="0.25" transform="rotate(-30 82 105)"/>
        <!-- 초록 꼭지 -->
        <g fill="url(#leaf)">
          <path d="M150 52 C 120 20, 70 22, 48 38 C 80 38, 115 55, 150 60 Z"/>
          <path d="M150 52 C 180 20, 230 22, 252 38 C 220 38, 185 55, 150 60 Z"/>
          <path d="M150 58 C 125 70, 105 92, 100 108 C 125 92, 142 82, 150 66 Z"/>
          <path d="M150 58 C 175 70, 195 92, 200 108 C 175 92, 158 82, 150 66 Z"/>
          <path d="M144 58 C 144 38, 148 22, 155 12 C 160 24, 162 42, 158 58 Z"/>
        </g>
      </svg>
      <div class="timer" aria-live="polite">25:00</div>
    </div>

    <div class="controls">
      <button type="button" class="btn btn-start">시작</button>
      <button type="button" class="btn btn-stop">정지</button>
      <button type="button" class="btn btn-reset">초기화</button>
    </div>

    <a class="btn-settings" href="settings.html">설정</a>
  </main>
  <script src="script.js"></script>
  <script>
    (function () {
      var el = document.getElementById('current-time');
      function updateClock() {
        el.textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false });
      }
      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
